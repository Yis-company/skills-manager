name: Changeset

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    # The version PR consumes changesets rather than adding one.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    name: Changeset present

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `changeset status --since` diffs against the base branch.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Only changes matching `changedFilePatterns` in .changeset/config.json
      # need a changeset, so docs- and CI-only PRs pass without one. For an app
      # change that should not appear in the changelog, run
      # `bunx changeset add --empty`.
      - name: Check for a changeset
        run: bunx changeset status --since=origin/${{ github.base_ref }}
