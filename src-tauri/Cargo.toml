[package]
name = "skills-manager"
version = "1.49.0"
description = "Agents Manager - skills, instructions and MCP configuration"
authors = ["tianliang"]
license = "MIT"
edition = "2021"
rust-version = "1.99"
default-run = "skills-manager"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
log = "0.4.35"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2.10.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-shell = "2.6.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-updater = "2.14.1"
tauri-plugin-single-instance = "2.5.5"
rusqlite = { version = "0.41.1", features = ["bundled"] }
uuid = { version = "1.29.0", features = ["v4", "v7"] }
sha2 = "0.11.1"
dirs = "7.0.0"
walkdir = "2.5.0"
fs2 = "0.4.3"
unicode-normalization = "0.1.26"
caseless = "0.2.2"
reqwest = { version = "0.13.5", features = ["blocking", "form", "json"] }
anyhow = "1.0.104"
chrono = "0.4.45"
gethostname = "1.1.0"
serde_yaml = "0.9"
toml_edit = "0.23.9"
git2 = { version = "0.21.0", features = ["https", "ssh", "vendored-openssl"] }
tokio = { version = "1.54.1", features = ["full"] }
regex = "1.13.1"
hex = "0.4.3"
urlencoding = "2.1.3"
zip = "9.3.0"
tempfile = "3.27.0"
semver = "1.0.28"
aes-gcm = "0.11.1"
keyring = "4.2.0"
rand = "0.10.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
notify = "8.2.1"
clap = { version = "4.6.7", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
junction = "2.1.0"

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }
keyring-core = "1.0.1"
